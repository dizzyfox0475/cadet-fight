<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>생도 격투</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: phone app — top status bar, then the 16:9 arena with the pad and buttons beside it (landscape) or under it (portrait); lobby card on top */
:root{
  --bg:#0c1120; --panel:#141b2d; --line:#253049; --fg:#e7ebf3; --muted:#8a94aa;
  --gold:#f0b545; --ink:#1a1405;
  --display:'Black Han Sans','Noto Sans KR',system-ui,sans-serif;
  --body:'Noto Sans KR',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.top{display:flex;align-items:center;gap:8px;padding:6px 12px;min-height:40px}
.top b{font-family:var(--display);font-weight:400;font-size:18px;white-space:nowrap}
.top b span{color:var(--gold)}
#status{flex:1;min-width:0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;font-size:13px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button.primary{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700}
button:disabled{opacity:.45}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#fsExit{display:none!important}
.main{flex:1;min-height:0;display:grid;grid-template:"arena arena" 1fr "pad btns" auto / 1fr 1fr;gap:8px;padding:0 12px 12px}
.arena{grid-area:arena;position:relative;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;background:#000;border-radius:6px;overflow:hidden}
canvas{display:block;touch-action:none}
.pad{grid-area:pad;justify-self:start;align-self:center;position:relative;width:150px;height:150px;border-radius:50%;
  background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.22);touch-action:none}
.pad::before{content:"";position:absolute;inset:38%;border-radius:50%;border:1px dashed rgba(255,255,255,.15)}
.knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(240,181,69,.55);pointer-events:none}
.btns{grid-area:btns;justify-self:end;align-self:center;display:grid;grid-template-columns:repeat(2,66px);gap:10px;touch-action:none}
.btns button{width:66px;height:66px;border-radius:50%;padding:0;font-family:var(--display);font-size:17px;line-height:1.1;
  background:rgba(20,27,45,.9);border:2px solid rgba(255,255,255,.28);touch-action:none}
.btns button small{display:block;font-family:var(--body);font-size:10px;color:var(--muted)}
.btns button.on{background:var(--gold);color:var(--ink)}
.btns button.on small{color:var(--ink)}
.btns [data-k=su]{border-color:var(--gold)}
@media (orientation:landscape){
  .main{grid-template:"pad arena btns" 1fr / auto 1fr auto;padding:0 max(10px,env(safe-area-inset-left,0px)) 8px}
  .pad{width:120px;height:120px;align-self:end;margin-bottom:8px}
  .knob{width:48px;height:48px;margin:-24px 0 0 -24px}
  .btns{grid-template-columns:repeat(2,54px);gap:8px;align-self:end;margin-bottom:8px}
  .btns button{width:54px;height:54px;font-size:15px}
}
@media (pointer:fine){ .pad,.btns{display:none} }   /* desktop: keyboard (1P keys) */
#lobby[hidden]{display:none}
#lobby{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(6,9,18,.88);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.card{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0}
.card h1 span{color:var(--gold)}
.label{font-size:12px;color:var(--muted);letter-spacing:.03em;margin:0}
.row{display:flex;gap:8px}
.row>*{flex:1}
.pick[aria-pressed=true]{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700}
.big{padding:12px;font-size:15px}
#code{min-width:0;font:inherit;font-size:16px;text-transform:uppercase;letter-spacing:.25em;text-align:center;
  background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:10px}
#lobbyMsg{min-height:1.4em;color:var(--gold);font-size:13.5px;margin:0}
#lobbyMsg strong{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.15em}
.hint{color:var(--muted);font-size:12px;line-height:1.55;margin:0}

#lobby .view[hidden],#select[hidden],#help[hidden],#botRow[hidden]{display:none}
#help{position:absolute;left:8px;top:16%;max-width:min(330px,46%);max-height:70%;overflow:auto;background:rgba(255,255,255,.78);color:#111;
  border-radius:6px;padding:8px 10px;font-size:12px;line-height:1.45;cursor:pointer}
#help b{font-weight:700}
#help h3{margin:0 0 4px;font-size:13px}
#help p{margin:0 0 6px}
#help table{border-collapse:collapse}
#help td{padding:1px 6px 1px 0;vertical-align:top;white-space:nowrap}
#help td+td{white-space:normal}
@media (max-height:520px){#help{top:13%;max-height:80%;font-size:10px;line-height:1.35;padding:6px 8px;max-width:min(300px,52%)}#help h3{font-size:11px}#help p{margin-bottom:4px}}
.field{min-width:0;font:inherit;font-size:16px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:10px}
.me{display:flex;justify-content:space-between;align-items:baseline;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.me b{font-family:var(--display);font-weight:400;font-size:20px}
.me span{color:var(--gold);font-size:14px}
.board{max-height:30vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.board table{width:100%;border-collapse:collapse;font-size:13px}
.board td,.board th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.board th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-weight:500}
.board td.r{text-align:right;color:var(--muted)}
.board tr.mine td{color:var(--gold)}
#select{position:fixed;inset:0;z-index:21;display:flex;align-items:center;justify-content:center;background:rgba(6,9,18,.94);
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow:auto}
#select .card{width:min(620px,100%)}
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chars button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;background:var(--bg)}
.chars img{height:min(22vh,120px);width:auto;object-fit:contain}
.chars button[aria-pressed=true]{border-color:var(--gold);background:#2a2412}
.chars button[aria-pressed=true] span{color:var(--gold);font-weight:700}
#selResult{margin:0;font-family:var(--display);font-size:20px;color:var(--gold);min-height:1.2em}
#selOpp{margin:0;font-size:13.5px;color:var(--muted)}
</style>

<div class="app">
  <div class="top">
    <b>생도 <span>격투</span></b>
    <span id="status">메뉴</span>
    <button id="restart" class="primary" type="button" hidden>다시 하기</button>
    <button id="fullscreen" type="button">전체화면</button>
    <button id="helpBtn" type="button" aria-pressed="false">설명 켜기</button>
    <button id="sound" type="button" aria-pressed="true">소리 켜짐</button>
    <button id="menu" type="button">메뉴</button>
  </div>
  <div class="main">
    <div class="arena"><canvas id="game" tabindex="0" aria-label="격투 게임 화면"></canvas><div id="help" hidden></div><button id="fsExit" type="button" hidden>전체화면 끄기</button></div>
    <div class="pad" id="pad" aria-label="방향 패드"><div class="knob" id="knob"></div></div>
    <div class="btns" aria-label="공격 버튼">
      <button type="button" data-k="lp">약<small>약공격</small></button>
      <button type="button" data-k="hp">강<small>강공격</small></button>
      <button type="button" data-k="sp">특<small>특수기</small></button>
      <button type="button" data-k="su">필<small>필살기</small></button>
    </div>
  </div>
</div>

<div id="lobby">
  <div class="card">
    <h1>생도 <span>격투</span></h1>
    <div class="view" id="vLogin">
      <div class="row"><input id="nick" class="field" maxlength="10" autocomplete="username" placeholder="닉네임" aria-label="닉네임"></div>
      <div class="row" style="margin-top:8px"><input id="pw" class="field" type="password" autocomplete="current-password" placeholder="비밀번호 (6자 이상)" aria-label="비밀번호"></div>
      <div class="row" style="margin-top:8px"><button type="button" id="login" class="primary big">로그인</button><button type="button" id="signup" class="big">회원가입</button></div>
    </div>
    <div class="view" id="vMenu" hidden>
      <div class="me"><b id="meNick"></b><span id="meRank"></span></div>
      <p class="label" style="margin-top:12px">온라인 대전</p>
      <div class="row"><button type="button" id="mm" class="primary big" disabled>랜덤 매칭</button></div>
      <div class="row" style="margin-top:8px"><button type="button" id="create" class="big" disabled>방 만들기</button></div>
      <div class="row" style="margin-top:8px"><input id="code" maxlength="4" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="코드 4자리" aria-label="방 코드"><button type="button" id="join" class="big" disabled>입장</button></div>
    </div>
    <p id="lobbyMsg" role="status"></p>
    <div class="row"><button type="button" id="solo" class="big">혼자 연습 (허수아비 상대)</button></div>
    <p class="label">계급 순위</p>
    <div class="board" id="board"><table><thead><tr><th>#</th><th>닉네임</th><th>계급</th><th class="r">전적</th></tr></thead><tbody id="boardBody"><tr><td colspan="4">불러오는 중…</td></tr></tbody></table></div>
    <div class="row" id="logoutRow" hidden><button type="button" id="logout">로그아웃</button></div>
    <p class="hint">같은 계급끼리: 이기면 +8, 지면 −6. 계급이 다르면: 높은 쪽은 이겨도 +3·지면 −7, 낮은 쪽은 이기면 +10·지면 −5. 30점이면 승급전(3판 2승), 0점에서 2연패하면 강등. 같은 와이파이가 아니어도, 데이터로도 돼요.</p>
  </div>
</div>

<div id="select" hidden>
  <div class="card">
    <p id="selResult" role="status"></p>
    <h1 style="font-size:24px">캐릭터 선택</h1>
    <div class="chars" id="chars"></div>
    <p id="selOpp"></p>
    <div class="row" id="botRow" hidden></div>
    <div class="row"><button type="button" id="ready" class="primary big">준비 완료</button><button type="button" id="selLeave" class="big">나가기</button></div>
  </div>
</div>
<script src="assets/peerjs.min.js"></script>

// ---------- practice bots (초급 / 상급) ----------
// The bot re-thinks every `think` frames and holds that plan in between; `guard` is how often it blocks a threat it sees.
const BOT = {
  easy: { think: 14, guard: 0.25, punish: 0.15, aggro: 0.35, anti: 0.1, special: 0.04, chain: 0.3 },
  hard: { think: 3, guard: 0.85, punish: 0.8, aggro: 0.6, anti: 0.6, special: 0.12, chain: 0.95 }
};
function botInput(f, o, B) {
  const b = f.bot || (f.bot = { next: 0, hold: { ...NONE }, press: null, wantChain: false });
  const n = { ...NONE }, now = b.clock = (b.clock || 0) + 1;   // own frame counter (called once per frame)
  if (!f.ground && !f.airUsed && f.vy > 0 && Math.abs(o.x - f.x) < 150) { n.hp = Math.random() < 0.5; n.lp = !n.hp; return n; }
  const toward = o.x > f.x ? 'r' : 'l', away = toward === 'r' ? 'l' : 'r';
  const d = Math.abs(o.x - f.x), M = f.c.moves, R = k => (M[k] && M[k].reach ? M[k].reach * K : 0);
  // keep the chain going: press 약 again while a light attack is out
  if (f.st === 'attack') { if (b.wantChain && f.mv && f.mv.next && f.t === f.mv.su + 1) n.lp = true; return n; }   // committed: only keep the chain going
  if (f.st === 'blockstun') { Object.assign(n, b.hold); return n; }   // keep holding the guard
  if (now < b.next) { Object.assign(n, b.hold); return n; }
  b.next = now + B.think; b.hold = { ...NONE }; b.wantChain = false;
  const r = Math.random;
  // 1) threat: an attack or a projectile coming at me
  const oAtk = o.st === 'attack' && o.mv && f.t >= 0 && o.t < o.mv.su + (o.mv.ac || 1) && d < (o.mv.reach || 0) * K + 60;
  const shot = G.proj.find(p => p.owner === o && !p.p.fall && (f.x - p.x) * p.dir > 0 && Math.abs(f.x - p.x) < 230);
  const shell = G.proj.find(p => p.owner === o && p.p.fall && Math.abs(f.x - p.x) < 110);
  if ((oAtk || shot || shell) && r() < B.guard) {
    const q = shot ? shot.p : shell ? shell.p : o.mv;
    const lvl = q.lvl || (q.low ? 'low' : 'mid');
    if (shell) b.hold[away] = true;                                    // walk out of the blast
    else if (q.unblock || q.grab) { if (lvl === 'high') b.hold.d = true; else b.hold.u = true; }   // can't block: duck the high one, jump the rest
    else { b.hold[away] = true; if (lvl === 'low') b.hold.d = true; }   // block high/low correctly
    Object.assign(n, b.hold); return n;
  }
  if (f.st !== 'idle' && f.st !== 'walk' && f.st !== 'crouch') return n;   // busy
  // 2) anti-air: they jump in close
  if (!o.ground && d < 170 && r() < B.anti) { n.hp = true; return n; }
  // 3) punish: they are recovering or stunned within reach
  const open = o.st === 'stun' || o.st === 'hitstun' || (o.st === 'attack' && o.mv && o.t >= o.mv.su + (o.mv.ac || 1)) || o.st === 'land';

  // 4) super when it can reach
  if (f.gauge >= 100 && r() < B.special * 2 && d < 420) { n.su = true; return n; }
  // 5) in range: mix up
  if (d < R('lp') + 8) {
    if (r() < B.aggro) {
      const x = r();
      if (x < 0.45) { n.lp = true; b.wantChain = r() < B.chain; }
      else if (x < 0.65) n.hp = true;
      else if (x < 0.8) { n.d = true; n.lp = true; }
      else if (x < 0.9) { n.d = true; n.hp = true; }
      else { n[toward] = true; n.sp = true; }                              // 앞+특 (grab / AED / 긴빠이 …)
    } else if (r() < 0.5) b.hold[away] = true;                          // back off a little (also guards)
    return n;
  }
  // 6) mid range: specials, or close in
  if (d < 420 && r() < B.special) { n.sp = true; return n; }
  if (r() < B.aggro * 0.15 && d < 260) { b.hold.u = true; b.hold[toward] = true; b.jumpIn = true; Object.assign(n, b.hold); return n; }
  b.hold[toward] = true; Object.assign(n, b.hold);

}

// ---------- simulation ----------
function step() {
  G.pt++;
  if (G.phase === 'intro' && G.pt >= 100) { G.phase = 'fight'; G.pt = 0; }
  if (G.phase === 'end' && G.pt >= 150) {
    if (G.p.some(f => f.wins >= 2)) { G.phase = 'match'; G.pt = 0; } else { G.round++; resetRound(); }
  }
  updateFx();
  for (const f of G.p) { if (f.hpLag > f.hp) f.hpLag = Math.max(f.hp, f.hpLag - 5); else f.hpLag = f.hp; }
  if (G.flash) { if (--G.flash.t <= 0) G.flash = null; return; }
  if (G.freeze > 0) { G.freeze--; return; }
  G.shake = G.shake > 0.5 ? G.shake * 0.85 : 0;

  for (let i = 0; i < 2; i++) {
    const f = G.p[i], o = G.p[1 - i];
    f.inp = G.phase !== 'fight' ? NONE : inputFor(i, f, o);
    if (opt.full) f.gauge = 100;
  }
  pressed.clear();

  const [a, b] = G.p;
  control(a, b); control(b, a);
  physics(a); physics(b);
  separate(a, b);
  melee(a, b); melee(b, a);
  updateProj(); updateSum();
  for (const f of G.p) {
    f.sx += (1 - f.sx) * 0.2; f.sy += (1 - f.sy) * 0.2;
    if (f.cd > 0) f.cd--;
    if (f.seal > 0) f.seal--;
    if (f.scd > 0) f.scd--;
    if (G.phase === 'fight' && f.st !== 'ko') overTime(f);
    recordTrail(f);
  }
  if (G.phase === 'fight' && --G.timer <= 0) { G.timer = 0; roundOver(); }
}

  if (f.ground && (FREE.includes(f.st) || f.st === 'blockstun')) f.face = o.x >= f.x ? 1 : -1;
  if (f.st === 'hitstun' || f.st === 'blockstun') {
    if (f.ground) f.vx *= 0.82;
    if (f.t >= f.lock) { f.st = f.ground ? 'idle' : 'jump'; f.t = 0; }
  } else if (f.st === 'stun') {
    if (f.ground) f.vx *= 0.8;
    if (--f.stun <= 0) { f.st = 'idle'; f.t = 0; }
  } else if (f.st === 'land') {
    f.vx *= 0.6;
    if (f.t >= f.lock) { f.st = 'idle'; f.t = 0; }
  } else if (f.st === 'dash') {
    f.vx = (f.dashDir > 0 ? 11 : -9) * f.face;
    const i = f.inp;
    if (f.t >= 14 || (f.t >= 6 && (i.lp || i.hp || i.sp || i.su))) { f.st = 'idle'; f.t = 0; f.vx = 0; }
  } else if (f.st === 'attack') {
    if (f.inp.lp) f.buf = 8; else if (f.buf > 0) f.buf--;
    const mv = f.mv;
    if (f.mk === 'reload' && f.t < mv.su && (f.inp.l || f.inp.r || f.inp.u)) { f.st = 'idle'; f.t = 0; f.mv = null; f.mk = null; popup(f, '재장전 취소', '#ff8a6b'); return; }
    // light chain: a light press during the active/recovery window links into the next hit
    if (mv.next && f.buf > 0 && f.t >= mv.su + mv.ac && f.ground) { f.buf = 0; start(f, mv.next); }
    else runMove(f, o);
  }
  if (FREE.includes(f.st)) free(f, f.inp);
  const { bk } = dirs(f, f.inp);
  f.guard = f.ground && bk && (['idle', 'walk', 'crouch', 'blockstun'].includes(f.st));
}

// 3점사 needs a loaded magazine; otherwise the press starts a reload
function gunReady(f, k) { return f.c.moves[k].mag && !f.ammo ? 'reload' : k; }
// 독 / 셀프 주사: effects that run on a timer (5 points every 0.3 s for 3 s = 50)
function overTime(f) {
  if (f.regen > 0) { f.regen--; if (f.regen % 18 === 0) f.hp = Math.min(1000, f.hp + 5); }
  if (f.poison > 0) {
    f.poison--;
    if (f.poison % 18 === 0) {
      f.hp = Math.max(0, f.hp - 5);
      if (f.hp <= 0) { Object.assign(f, { st: 'ko', t: 0, ground: false, vy: -7, vx: 0, mv: null, mk: null }); freeze(16); shake(10); roundOver(); }
    }
  }
}
function canUse(f, k) {
  const mv = f.c.moves[k];
  if (mv.cd && f.cd > 0) return false;
  if (mv.scd && f.scd > 0) return false;
  if (mv.kind === 'proj') return !!mv.scd || !G.proj.some(p => p.owner === f);   // a short cooldown replaces the one-on-screen limit
  if (mv.kind === 'shout') return f.cd <= 0;
  return true;
}

function free(f, i) {
  const { fw, bk } = dirs(f, i), hp = i.hp && !(f.seal > 0);   // 긴빠이: 강공격·필살기 sealed
  if (i.su && f.gauge >= 100 && !(f.seal > 0)) return start(f, 'su');
  if (i.sp) { const k = fw ? 'sp2' : i.d && f.ground && f.c.moves.csp ? 'csp' : 'sp1'; if (canUse(f, k)) return start(f, gunReady(f, k)); }
  if (!f.ground) {
    if ((hp || i.lp) && !f.airUsed) { f.airUsed = true; const k = hp ? 'jhp' : 'jlp'; f.airMove = f.c.moves[k]; return start(f, k); }
    if (fw || bk) f.vx += ((fw ? 4.2 : -4.2) * f.face - f.vx) * 0.2;   // air control: steer while jumping
    return;
  }
  if (hp) { const k = gunReady(f, i.d ? 'chp' : 'hp'); if (canUse(f, k)) return start(f, k); return; }
  if (i.lp) return start(f, i.d ? 'clp' : 'lp');
  const tapF = f.face > 0 ? i.pr : i.pl, tapB = f.face > 0 ? i.pl : i.pr;
  if (tapF) { if (tick - f.tapF < 14) return dash(f, 1); f.tapF = tick; }
  if (tapB) { if (tick - f.tapB < 14) return dash(f, -1); f.tapB = tick; }
  if (i.u) {
    f.st = 'jump'; f.t = 0; f.ground = false; f.vy = -15 * Math.sqrt(K); f.vx = (fw ? 4.2 : bk ? -4.2 : 0) * f.face; f.crouch = false;
    squash(f, 0.82, 1.2); return;
  }
  if (i.d) { if (f.st !== 'crouch') { f.st = 'crouch'; f.t = 0; } f.crouch = true; f.vx = (fw ? 1.8 : bk ? -1.5 : 0) * f.face; return; }   // crouch-walk
  f.crouch = false;
  if (fw || bk) { if (f.st !== 'walk') { f.st = 'walk'; f.t = 0; } f.vx = (fw ? 4 : -3.2) * f.face; }
  else { if (f.st !== 'idle') { f.st = 'idle'; f.t = 0; } f.vx = 0; }
}

function dash(f, d) {
  Object.assign(f, { st: 'dash', t: 0, dashDir: d, crouch: false, tapF: -99, tapB: -99 });
  f.vx = (d > 0 ? 11 : -9) * f.face;
  squash(f, 1.15, 0.9);
}
function start(f, k) {
  const mv = f.c.moves[k];
  Object.assign(f, { st: 'attack', mk: k, mv, t: 0, hits: 0, lastHitT: -99, rushStop: false, crouch: !!mv.low, buf: 0 });
  if (f.ground) f.vx = 0;
  if (k === 'su') { f.gauge = 0; G.flash = { t: 42, name: mv.name, who: f }; }
  if (mv.cd) f.cd = mv.cd;
  if (mv.scd) f.scd = mv.scd;
  if (mv.mag) f.ammo = false;
  squash(f, 0.9, 1.08);
}

function runMove(f, o) {
  const mv = f.mv, total = mv.su + (mv.ac || 1) + mv.re;
  if (f.ground) f.vx *= 0.7;
  if (mv.kind === 'rush' && !f.rushStop && f.t >= mv.su && f.t < mv.su + mv.ac) f.vx = mv.speed * f.face;
  if (mv.burst && f.t > mv.su && (f.t - mv.su) % mv.every === 0 && (f.t - mv.su) / mv.every < mv.burst) fire(f, o, mv, (f.t - mv.su) / mv.every);   // follow-up rounds
  if (f.t === mv.su) { fire(f, o, mv, 0); squash(f, 1.16, 0.9); if (mv.step && f.ground) f.vx = mv.step * K * f.face;
    if (mv.dive && !f.ground) { f.vy = Math.max(f.vy, mv.dive); f.vx = mv.diveX * f.face; squash(f, 0.85, 1.2); } }  // dive diagonally forward
  if (f.t >= total) { f.st = f.ground ? 'idle' : 'jump'; f.t = 0; f.mv = null; f.mk = null; }
}

function fire(f, o, mv, n = 0) {
  if (mv.kind === 'proj') {
    const p = mv.vars ? mv.vars[Math.random() * mv.vars.length | 0] : mv.proj;
    if (p.fall) {   // artillery: lands where the opponent is now (or around them), after a warning marker
      const x = Math.max(20, Math.min(W - 20, o.x + (p.offs ? p.offs[n] * f.face : 0)));
      G.proj.push({ owner: f, tgt: o, x, y: -40, vx: 0, wait: p.warn, dir: f.face, p, w: 18, h: 30, life: 240, passed: true, done: false });
      if (mv.ship) fx('muzzle', f.x - f.face * 60 * K, f.y - 150 * K, { up: true, dir: f.face });
      else fx('muzzle', f.x + f.face * 52 * K, f.y - 152 * K, { up: true, dir: f.face });
      return;
    }
    if (p.home) {   // missile from the jet overhead, steering toward the opponent
      G.proj.push({ owner: f, tgt: o, x: f.x, y: 70, vx: 0, ang: Math.atan2(o.y - 90 * K - 70, o.x - f.x), dir: f.face, p, w: p.w, h: p.h, life: 220, passed: true, done: false });
      fx('muzzle', f.x, 70, { dir: f.face });
      return;
    }
    for (const ang of mv.fan || [0]) {   // a fan sends several at spread angles
      G.proj.push({ owner: f, tgt: o, x: f.x + f.face * (p.mx || 50) * K, y: f.y - p.hy * K, vx: p.vx * Math.cos(ang) * f.face, vy: p.vx * Math.sin(ang), ang, dir: f.face, p,
                    w: p.w ? p.w * K : textW(p.text, p.size * K), h: p.h ? p.h * K : p.size * K + 2, life: 240, passed: false, done: false });
    }
    if (p.arc) {   // lob it so it lands where the opponent stands now
      const q = G.proj[G.proj.length - 1], g = p.grav, dy = GROUND - 8 - q.y, t = (-p.vy + Math.sqrt(p.vy * p.vy + 2 * g * dy)) / g;
      q.vx = f.face * Math.max(2.5, Math.min(10, Math.abs(o.x - q.x) / t));
    }
    if (mv.gun) fx('muzzle', f.x + f.face * ((p.mx || 50) + 8) * K, f.y - p.hy * K, { dir: f.face });
  } else if (mv.kind === 'shout') {
    shout(f, o, mv.radius, { dmg: mv.dmg, stun: mv.stun });
  } else if (mv.kind === 'heal') {
    f.regen = 180; popup(f, '회복 중', '#7fe3a0');
  } else if (mv.kind === 'reload') {
    f.ammo = true; popup(f, '장전 완료', '#7fe3a0');
  } else if (mv.kind === 'super') {
    G.sum.push(counselor(f, o, -40, 'run'), counselor(f, o, W + 40, 'run'));
  }
}

function counselor(owner, tgt, x, mode) {
  return { owner, tgt, x, y: mode === 'drop' ? -60 : GROUND, mode, st: mode, t: 0, face: tgt.x >= x ? 1 : -1, hit: false, a: 1 };
}

function shout(f, o, r, a) {
  fx('ring', f.x, f.y - 90 * K, { life: a.big ? 40 : 24, r: a.big ? 620 : r });
  G.fx.push({ k: 'text', x: f.x, y: f.y - 160, t: 0, life: 40, text: a.big ? '전체 점호!' : '전달!', color: '#f0b545', size: 30 });
  shake(a.big ? 10 : 5);
  if (Math.abs(o.x - f.x) <= r && o.st !== 'ko') {
    tryHit(f, o, { dmg: a.dmg, unblock: true, stun: a.stun, push: 2, stop: 6, srcX: f.x, lvl: 'mid', py: o.y - 100 * K });
  }
}

function physics(f) {
  if (!f.ground) f.vy += 0.8;
  f.x += f.vx; f.y += f.vy;
  if (f.y >= GROUND) {
    f.y = GROUND;
    if (!f.ground) {
      f.ground = true; f.vy = 0;
      if (f.st !== 'ko') {
        if (f.st === 'jump' || f.st === 'attack') {
          if (f.airMove && (f.st === 'attack' || f.airUsed)) Object.assign(f, { st: 'land', t: 0, lock: f.airMove.landLag || 8, vx: 0 });   // air attack: short crouched recovery
          else f.st = 'idle';
          f.t = 0; f.mv = null; f.mk = null;
        }
        f.airUsed = false; f.airMove = null;
        squash(f, 1.2, 0.8);
      }
    }
  }
  if (f.st === 'ko' && f.ground) f.vx *= 0.85;
  f.x = Math.max(36, Math.min(W - 36, f.x));
}

function separate(a, b) {
  if (a.st === 'ko' || b.st === 'ko' || Math.abs(a.y - b.y) > 100 * K) return;
  const dx = b.x - a.x;
  if (Math.abs(dx) >= 46 * K) return;
  const ov = (46 * K - Math.abs(dx)) / 2, s = dx !== 0 ? Math.sign(dx) : a.face;
  a.x = Math.max(36, Math.min(W - 36, a.x - s * ov));
  b.x = Math.max(36, Math.min(W - 36, b.x + s * ov));
}

function melee(f, o) {
  if (f.st !== 'attack' || !f.mv || !['melee', 'rush', 'grab'].includes(f.mv.kind)) return;
  const mv = f.mv;
  if (f.t < mv.su || f.t >= mv.su + mv.ac) return;
  if (mv.kind === 'grab' && (!o.ground || ['hitstun', 'blockstun', 'stun', 'ko'].includes(o.st))) return;
  if (f.hits >= (mv.hits || 1) || f.t - f.lastHitT < (mv.every || 99)) return;
  const x1 = f.x + f.face * 18 * K, x2 = f.x + f.face * mv.reach * K, hy = f.y - mv.hy * K, hh = (mv.hh || 32) * K;
  if (overlap({ x: Math.min(x1, x2), y: hy - hh / 2, w: Math.abs(x2 - x1), h: hh }, hurt(o))) {
    f.hits++; f.lastHitT = f.t;
    if (mv.kind === 'rush') { f.rushStop = true; f.vx = 0; }
    const last = f.hits >= (mv.hits || 1);
    tryHit(f, o, { dmg: mv.dmg, hs: mv.hs, push: last && mv.lastPush ? mv.lastPush : mv.push, stop: mv.stop, lvl: mv.lvl || 'mid', counter: mv.counter, srcX: f.x, py: hy,
                   grab: mv.kind === 'grab', unblock: mv.kind === 'grab' || !!mv.unblock, seal: mv.seal, gbreak: mv.gbreak, stun: mv.stun });
    if (mv.pull && o.st !== 'ko') o.vx = -f.face * 10;   // rope drags them in
    if (mv.dizzy && o.st === 'hitstun') popup(o, '휘청!', '#ffcf5a');
    if (mv.fling && o.st !== 'ko') Object.assign(o, { vx: f.face * 9, vy: -12, ground: false });   // thrown far forward
    if (mv.toss && o.st !== 'ko') {   // land behind the thrower, flying away from them
      o.x = Math.max(36, Math.min(W - 36, f.x - f.face * 70 * K));
      Object.assign(o, { vx: -f.face * 5, vy: -9, ground: false });
    }
  }
}

function updateProj() {
  for (const p of G.proj) {
    if (p.p.fall) { fallShell(p); continue; }
    if (p.p.arc) {   // grenade: arcs and bursts on the floor; only fighters standing on the floor are caught
      const o = p.tgt;
      p.x += p.vx; p.vy = (p.vy == null ? p.p.vy : p.vy) + p.p.grav; p.y += p.vy; p.life--;
      if (p.y >= GROUND - 8) {
        p.done = true; fx('boom', p.x, GROUND - 16, { life: 20 }); shake(5);
        if (o.ground && Math.abs(o.x - p.x) < p.p.radius * K) tryHit(p.owner, o, { ...p.p, srcX: p.owner.x, py: GROUND - 30 * K });
      }
      continue;
    }
    if (p.p.home) {
      const o = p.tgt, want = Math.atan2(o.y - 80 * K - p.y, o.x - p.x);
      let d = want - p.ang; d = Math.atan2(Math.sin(d), Math.cos(d));
      p.ang += Math.max(-p.p.turn, Math.min(p.p.turn, d));
      p.x += Math.cos(p.ang) * p.p.speed; p.y += Math.sin(p.ang) * p.p.speed; p.dir = Math.cos(p.ang) >= 0 ? 1 : -1; p.life--;
      if (overlap({ x: p.x - 22, y: p.y - 11, w: 44, h: 22 }, hurt(o))) { p.done = true; fx('boom', p.x, p.y, { life: 22 }); shake(7); tryHit(p.owner, o, { ...p.p, srcX: p.owner.x, py: p.y }); }
      else if (p.y >= GROUND - 6 || p.life <= 0) { p.done = true; fx('boom', p.x, Math.min(p.y, GROUND - 20), { life: 22 }); shake(4); }
      continue;
    }
    p.x += p.vx; if (p.vy) p.y += p.vy; p.life--;
    const o = p.tgt;
    if (p.y > GROUND - 4) { p.done = true; continue; }   // fan needles that hit the floor
    if (overlap({ x: p.x - p.w / 2, y: p.y - p.h / 2, w: p.w, h: p.h }, hurt(o))) {
      p.done = true;
      tryHit(p.owner, o, { ...p.p, srcX: p.x - p.dir * 100, py: p.y });
    } else if (!p.passed && (p.x - o.x) * p.dir > 30 && Math.abs(p.x - o.x) < 120 && o.crouch && o.ground) {
      p.passed = true; popup(o, '회피!', '#7fe3a0');
    }
  }
  G.proj = G.proj.filter(p => !p.done && p.life > 0 && p.x > -300 && p.x < W + 300);
}

function fallShell(p) {
  if (p.wait > 0) { p.wait--; return; }
  p.y += p.p.vy;
  if (p.y < GROUND - 10) return;
  p.done = true;
  const o = p.tgt, q = p.p;
  fx('boom', p.x, GROUND - 20, { life: 22 }); shake(6);
  if (Math.abs(o.x - p.x) < q.radius * K && GROUND - o.y < 90 * K)   // a high jump clears the blast
    tryHit(p.owner, o, { ...q, srcX: p.owner.x, py: GROUND - 60 * K });   // guard: hold away from the shooter
  const me = p.owner;
  if (q.ff && Math.abs(me.x - p.x) < q.radius * K && GROUND - me.y < 90 * K)   // 거북선: the captain is not spared
    tryHit(o, me, { ...q, srcX: p.x, py: GROUND - 60 * K });
}

function updateSum() {
  for (const s of G.sum) {
    s.t++;
    const o = s.tgt;
    if (s.st === 'run') {
      s.face = o.x >= s.x ? 1 : -1; s.x += s.face * 6.5;
      if (Math.abs(o.x - s.x) < 62 * K) { s.st = 'atk'; s.t = 0; }
      else if (s.t > 200) { s.st = 'leave'; s.t = 0; }
    } else if (s.st === 'drop') {
      s.y += 11;
      if (s.y >= GROUND) { s.y = GROUND; s.st = 'atk'; s.t = 0; shake(4); }
    } else if (s.st === 'atk') {
      if (s.t === 7 && !s.hit) {
        const box = s.mode === 'drop' ? { x: s.x - 36, y: s.y - 130, w: 72, h: 130 }
                                      : { x: Math.min(s.x, s.x + s.face * 80 * K), y: s.y - 112 * K, w: 80 * K, h: 72 * K };
        if (overlap(box, hurt(o))) {
          s.hit = true;
          // guard direction is judged from this counselor: hold away from the one that is arriving
          tryHit(s.owner, o, { dmg: 70, hs: 22, push: 7, stop: 7, lvl: 'mid', srcX: s.x, py: s.y - 85 * K });
        }
      }
      if (s.t >= 22) { s.st = 'leave'; s.t = 0; }
    } else if (s.st === 'leave') {
      s.a = Math.max(0, 1 - s.t / 18);
    }
  }
  G.sum = G.sum.filter(s => !(s.st === 'leave' && s.t >= 18));
}

function tryHit(att, def, a) {
  if (def.st === 'ko') return;
  const pm = def.st === 'attack' && def.mv && def.mv.kind === 'parry' ? def.mv : null;
  if (pm && !a.grab && def.t >= pm.su && def.t < pm.su + pm.ac) {   // 패링 성공: no damage, dash straight back in
    popup(def, '패링!', '#7cc8ff'); fx('guard', def.x + def.face * 20, a.py ?? def.y - 90 * K); freeze(10); shake(4);
    def.face = att.x >= def.x ? 1 : -1;
    start(def, pm.counter);
    return;
  }
  const dir = Math.sign(def.x - a.srcX) || att.face;
  const i = def.inp || NONE;
  const away = (dir > 0 ? i.r : i.l) || (!i.l && !i.r && !i.noAuto && dir === -def.face);   // hold away, or stand still facing the attack
  const guardable = def.ground && ['idle', 'walk', 'crouch', 'blockstun'].includes(def.st) && away;
  let blocked = guardable && !a.unblock;
  if (blocked && a.lvl === 'overhead' && def.crouch) blocked = false;   // jump attacks: stand to block
  if (blocked && a.lvl === 'low' && !def.crouch) blocked = false;        // low attacks: crouch to block
  const py = a.py ?? def.y - 80 * K;
  if (blocked && a.gbreak) {   // 개머리: knocks the guard open — no damage, but they are left wide open
    Object.assign(def, { st: 'hitstun', t: 0, lock: 34, vx: dir * 3, crouch: false, mv: null, mk: null });
    popup(def, '가드 브레이크!', '#ff9b3d'); fx('guard', def.x - dir * 22, py); freeze(6); shake(4);
    return;
  }
  if (blocked) {
    Object.assign(def, { st: 'blockstun', t: 0, lock: 12, vx: dir * a.push * 0.6 });
    att.gauge = Math.min(100, att.gauge + 3); def.gauge = Math.min(100, def.gauge + 2);
    fx('guard', def.x - dir * 22, py);
    freeze(Math.ceil((a.stop || 4) / 2));
    return;
  }
  if (a.grab) popup(def, '잡기!', '#ff6a4d');
  else if (guardable && a.unblock) popup(def, '가드 불가', '#ff6a4d');
  if (a.seal) { def.seal = a.seal; popup(def, '긴빠이 당함!', '#ff6a4d'); }
  if (a.poison) { def.poison = Math.min(540, def.poison + a.poison / 5 * 18); popup(def, '중독!', '#7fe36a'); }   // 5 per 0.3 s until the dose runs out (max 150 queued)
  if (a.counter && def.crouch && def.ground) {
    a = { ...a, dmg: Math.round(a.dmg * 1.5), hs: (a.hs || 14) + 12, stop: (a.stop || 4) + 4 };
    popup(def, '카운터!', '#ff9b3d');
  }
  def.hp = Math.max(0, def.hp - a.dmg);
  att.gauge = Math.min(100, att.gauge + 8); def.gauge = Math.min(100, def.gauge + 4);
  if (a.drain) { def.gauge = Math.max(0, def.gauge - a.drain); popup(def, '게이지 −' + a.drain, '#ffcf5a'); }
  def.crouch = false; def.mv = null; def.mk = null;
  if (a.stun) Object.assign(def, { st: 'stun', stun: a.stun, t: 0 });
  else Object.assign(def, { st: 'hitstun', t: 0, lock: a.hs || 14 });
  def.vx = dir * (a.push || 3);
  if (!def.ground) def.vy = -5;
  fx('spark', def.x - dir * 16, py, { big: (a.stop || 0) >= 7 });
  freeze(a.stop || 4); shake((a.stop || 0) >= 7 ? 7 : 3);
  squash(def, 0.84, 1.12);
  if (def.hp <= 0) {

function spgRise(f) {

  return Math.max(0, Math.min(1, (end - f.t) / 14));

// Same tier +8 / −6. Different tier: higher wins +3 / loses −7, lower wins +10 / loses −5.

// Losing twice in a row while at 0 points → previous tier at PROMO−10.

  if (won) {

function createRoom(attempt = 0, matchId = '') {

function hostEvents(peer, attempt, matchId) {

function joinRoom(matchId = '') {
  const code = matchId ? '' : $('code').value.trim().toLowerCase();
  if (!matchId && !/^[a-z0-9]{4}$/.test(code)) { lobbyMsg.textContent = '방 코드 4자리를 입력해주세요.'; return; }
  leaveRoom();
  const peer = new Peer();

  if (!matchId) { lobbyMsg.textContent = '연결 중…'; setStatus('방 ' + code.toUpperCase() + ' · 연결 중'); }
  const fail = msg => { leaveRoom(); if (matchId) MM.retry(); else { lobbyMsg.textContent = msg; setStatus('메뉴'); } };
  NET.timer = setTimeout(() => {
    if (NET.peer === peer && !(NET.conn && NET.conn.open)) fail('15초 안에 연결되지 않았어요. ' + ERR.webrtc);
  }, matchId ? 12000 : 15000);
  const dial = () => {
    if (NET.peer !== peer) return;
    const conn = peer.connect(ID_PREFIX + (matchId || code), { reliable: false, serialization: 'json' });
    NET.conn = conn;
    conn.on('open', () => { clearTimeout(NET.timer); if (matchId) queueDel(); NET.sentIn = ''; send({ t: 'hello', prof: myProfile() }); lobbyMsg.textContent = '연결됐어요…'; });
    conn.on('data', m => {

      if (m.t === 'full') { leaveRoom(); showLobby('이미 두 명이 대전 중인 방이에요.'); setStatus('메뉴'); return; }
      if (m.t === 'hello') { NET.opp = cleanProf(m.prof); openSelect(); setStatus((matchId ? '랜덤 매칭' : '방 ' + code.toUpperCase()) + ' · 캐릭터 선택'); }
      else if (m.t === 'pick') { if (CHARS[m.char]) SEL.opp.char = m.char; SEL.opp.ready = !!m.ready; NET.opp = cleanProf(m.prof); if (NET.stage === 'select') drawSelect(); }
      else if (m.t === 'go' && CHARS[m.p1] && CHARS[m.p2]) { PICK.p1 = m.p1; PICK.p2 = m.p2; NET.lastSeq = -1; NET.lastSnap = null; startFight(); }
      else if (m.t === 's' && NET.stage === 'fight' && (m.q | 0) > NET.lastSeq) { NET.lastSeq = m.q | 0; applySnap(m.s); }
    });

// The lower uid of a pair hosts at a peer id built from its session; the other dials it.
const MM = {
  on: false, sess: '', timer: 0, with: '', waited: 0,
  start() {
    if (!ACC.me) return;
    leaveRoom(); Object.assign(this, { on: true, sess: Math.random().toString(36).slice(2, 10), with: '', waited: 0 });
    $('mm').textContent = '매칭 취소'; lobbyMsg.textContent = '랜덤 매칭 찾는 중…'; setStatus('랜덤 매칭 대기');

    if (msg != null) lobbyMsg.textContent = msg;
  },
  retry() { if (ACC.me) { showLobby(''); this.start(); } },
  // Two-step handshake so both phones agree: I claim my best partner (with = their uid);
  // when their entry claims me back (or already claimed me), we both connect.
  async tick() {
    if (!this.on) return;
    try {
      const me = ACC.uid, now = await queuePut(this.sess, this.with);
      const list = (await queueList()).filter(q => now - q.at < 10000 && q.sess), by = Object.fromEntries(list.map(q => [q.uid, q]));
      if (!this.on) return;
      if (this.with) {
        const p = by[this.with];
        if (p && p.with === me) return this.go(p);
        if (!p || (p.with && p.with !== me) || ++this.waited > 3) { this.with = ''; this.waited = 0; }   // they went elsewhere: look again
      }
      if (!this.with) {
        const claimer = list.find(q => q.uid !== me && q.with === me);
        if (claimer) { this.with = claimer.uid; await queuePut(this.sess, this.with); return this.go(claimer); }
        const free = list.filter(q => !q.with || q.uid === me), pair = pairUp(free).find(p => p[0].uid === me || p[1].uid === me);
        if (pair) { this.with = (pair[0].uid === me ? pair[1] : pair[0]).uid; this.waited = 0; await queuePut(this.sess, this.with); }
      }
      lobbyMsg.textContent = `랜덤 매칭 찾는 중… 대기 ${list.length}명`;
    } catch (e) { lobbyMsg.textContent = e.message + ' 다시 시도하는 중…'; }
    this.timer = setTimeout(() => this.tick(), this.with ? 1000 : 3000);
  },
  go(opp) {
    // keep my entry until we are connected, so the partner still sees my claim; it expires on its own anyway
    this.on = false; clearTimeout(this.timer); $('mm').textContent = '랜덤 매칭';
    const me = ACC.uid, hostUid = me < opp.uid ? me : opp.uid, hostSess = hostUid === me ? this.sess : opp.sess;
    lobbyMsg.textContent = `상대를 찾았어요: ${opp.nick} (${TIERS[opp.tier]}) · 연결 중…`;
    if (hostUid === me) createRoom(0, 'mm-' + hostSess); else joinRoom('mm-' + hostSess);
  }
};
$('mm').addEventListener('click', () => MM.on ? MM.stop('매칭을 취소했어요.') : MM.start());
addEventListener('pagehide', () => { if (MM.on) queueDel(); });
addEventListener('pagehide', leaveRoom);

// start: resume a saved login, show the menu
NET.done = true;
updateMe(); refreshBoard(); setStatus('메뉴');
if (typeof window.Peer !== 'function') lobbyMsg.textContent = '온라인 모듈을 불러오지 못했어요. 혼자 연습은 가능해요.';
if (FB_ON) resume().then(me => { if (me) { updateMe(); refreshBoard(); } });

// ---------- loop ----------
newMatch();
let last = performance.now(), acc = 0;
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  acc += dt * (opt.slow ? 0.25 : 1);
  while (acc >= 1 / 60) { if (NET.role !== 'guest') step(); tick++; acc -= 1 / 60; }
  netFrame();
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__game = { get G() { return G; }, step, opt, NET };
})();
</script>
