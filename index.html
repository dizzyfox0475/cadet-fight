<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>생도 격투</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: phone app — top status bar, then the 16:9 arena with the pad and buttons beside it (landscape) or under it (portrait); lobby card on top */
:root{
  --bg:#0c1120; --panel:#141b2d; --line:#253049; --fg:#e7ebf3; --muted:#8a94aa;
  --gold:#f0b545; --ink:#1a1405;
  --display:'Black Han Sans','Noto Sans KR',system-ui,sans-serif;
  --body:'Noto Sans KR',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.top{display:flex;align-items:center;gap:8px;padding:6px 12px;min-height:40px}
.top b{font-family:var(--display);font-weight:400;font-size:18px;white-space:nowrap}
.top b span{color:var(--gold)}
#status{flex:1;min-width:0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;font-size:13px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button.primary{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700}
button:disabled{opacity:.45}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#fsExit{display:none!important}
.main{flex:1;min-height:0;display:grid;grid-template:"arena arena" 1fr "pad btns" auto / 1fr 1fr;gap:8px;padding:0 12px 12px}
.arena{grid-area:arena;position:relative;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;background:#000;border-radius:6px;overflow:hidden}
canvas{display:block;touch-action:none}
.pad{grid-area:pad;justify-self:start;align-self:center;position:relative;width:150px;height:150px;border-radius:50%;
  background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.22);touch-action:none}
.pad::before{content:"";position:absolute;inset:38%;border-radius:50%;border:1px dashed rgba(255,255,255,.15)}
.knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(240,181,69,.55);pointer-events:none}
.btns{grid-area:btns;justify-self:end;align-self:center;display:grid;grid-template-columns:repeat(2,66px);gap:10px;touch-action:none}
.btns button{width:66px;height:66px;border-radius:50%;padding:0;font-family:var(--display);font-size:17px;line-height:1.1;
  background:rgba(20,27,45,.9);border:2px solid rgba(255,255,255,.28);touch-action:none}
.btns button small{display:block;font-family:var(--body);font-size:10px;color:var(--muted)}
.btns button.on{background:var(--gold);color:var(--ink)}
.btns button.on small{color:var(--ink)}
.btns [data-k=su]{border-color:var(--gold)}
@media (orientation:landscape){
  .main{grid-template:"pad arena btns" 1fr / auto 1fr auto;padding:0 max(10px,env(safe-area-inset-left,0px)) 8px}
  .pad{width:120px;height:120px;align-self:end;margin-bottom:8px}
  .knob{width:48px;height:48px;margin:-24px 0 0 -24px}
  .btns{grid-template-columns:repeat(2,54px);gap:8px;align-self:end;margin-bottom:8px}
  .btns button{width:54px;height:54px;font-size:15px}
}
@media (pointer:fine){ .pad,.btns{display:none} }   /* desktop: keyboard (1P keys) */
#lobby[hidden]{display:none}
#lobby{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(6,9,18,.88);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.card{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0}
.card h1 span{color:var(--gold)}
.label{font-size:12px;color:var(--muted);letter-spacing:.03em;margin:0}
.row{display:flex;gap:8px}
.row>*{flex:1}
.pick[aria-pressed=true]{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700}
.big{padding:12px;font-size:15px}
#code{min-width:0;font:inherit;font-size:16px;text-transform:uppercase;letter-spacing:.25em;text-align:center;
  background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:10px}
#lobbyMsg{min-height:1.4em;color:var(--gold);font-size:13.5px;margin:0}
#lobbyMsg strong{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.15em}
.hint{color:var(--muted);font-size:12px;line-height:1.55;margin:0}

#lobby .view[hidden],#select[hidden]{display:none}
.field{min-width:0;font:inherit;font-size:16px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:10px}
.me{display:flex;justify-content:space-between;align-items:baseline;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.me b{font-family:var(--display);font-weight:400;font-size:20px}
.me span{color:var(--gold);font-size:14px}
.board{max-height:30vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.board table{width:100%;border-collapse:collapse;font-size:13px}
.board td,.board th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.board th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-weight:500}
.board td.r{text-align:right;color:var(--muted)}
.board tr.mine td{color:var(--gold)}
#select{position:fixed;inset:0;z-index:21;display:flex;align-items:center;justify-content:center;background:rgba(6,9,18,.94);
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow:auto}
#select .card{width:min(620px,100%)}
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chars button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;background:var(--bg)}
.chars img{height:min(22vh,120px);width:auto;object-fit:contain}
.chars button[aria-pressed=true]{border-color:var(--gold);background:#2a2412}
.chars button[aria-pressed=true] span{color:var(--gold);font-weight:700}
#selResult{margin:0;font-family:var(--display);font-size:20px;color:var(--gold);min-height:1.2em}
#selOpp{margin:0;font-size:13.5px;color:var(--muted)}
</style>

<div class="app">
  <div class="top">
    <b>생도 <span>격투</span></b>
    <span id="status">메뉴</span>
    <button id="restart" class="primary" type="button" hidden>다시 하기</button>
    <button id="fullscreen" type="button">전체화면</button>
    <button id="sound" type="button" aria-pressed="true">소리 켜짐</button>
    <button id="menu" type="button">메뉴</button>
  </div>
  <div class="main">
    <div class="arena"><canvas id="game" tabindex="0" aria-label="격투 게임 화면"></canvas><button id="fsExit" type="button" hidden>전체화면 끄기</button></div>
    <div class="pad" id="pad" aria-label="방향 패드"><div class="knob" id="knob"></div></div>
    <div class="btns" aria-label="공격 버튼">
      <button type="button" data-k="lp">약<small>약공격</small></button>
      <button type="button" data-k="hp">강<small>강공격</small></button>
      <button type="button" data-k="sp">특<small>특수기</small></button>
      <button type="button" data-k="su">필<small>필살기</small></button>
    </div>
  </div>
</div>

<div id="lobby">
  <div class="card">
    <h1>생도 <span>격투</span></h1>
    <div class="view" id="vLogin">
      <div class="row"><input id="nick" class="field" maxlength="10" autocomplete="username" placeholder="닉네임" aria-label="닉네임"></div>
      <div class="row" style="margin-top:8px"><input id="pw" class="field" type="password" autocomplete="current-password" placeholder="비밀번호 (6자 이상)" aria-label="비밀번호"></div>
      <div class="row" style="margin-top:8px"><button type="button" id="login" class="primary big">로그인</button><button type="button" id="signup" class="big">회원가입</button></div>
    </div>
    <div class="view" id="vMenu" hidden>
      <div class="me"><b id="meNick"></b><span id="meRank"></span></div>
      <p class="label" style="margin-top:12px">온라인 대전</p>
      <div class="row"><button type="button" id="create" class="primary big" disabled>방 만들기</button></div>
      <div class="row" style="margin-top:8px"><input id="code" maxlength="4" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="코드 4자리" aria-label="방 코드"><button type="button" id="join" class="big" disabled>입장</button></div>
    </div>
    <p id="lobbyMsg" role="status"></p>
    <div class="row"><button type="button" id="solo" class="big">혼자 연습 (허수아비 상대)</button></div>
    <p class="label">계급 순위</p>
    <div class="board" id="board"><table><thead><tr><th>#</th><th>닉네임</th><th>계급</th><th class="r">전적</th></tr></thead><tbody id="boardBody"><tr><td colspan="4">불러오는 중…</td></tr></tbody></table></div>
    <div class="row" id="logoutRow" hidden><button type="button" id="logout">로그아웃</button></div>
    <p class="hint">같은 계급끼리: 이기면 +8, 지면 −8. 계급이 다르면: 높은 쪽은 이겨도 +3·지면 −7, 낮은 쪽은 이기면 +10·지면 −5. 100점이면 승급전(3판 2승), 0점에서 2연패하면 강등. 같은 와이파이가 아니어도, 데이터로도 돼요.</p>
  </div>
</div>

<div id="select" hidden>
  <div class="card">
    <p id="selResult" role="status"></p>
    <h1 style="font-size:24px">캐릭터 선택</h1>
    <div class="chars" id="chars"></div>
    <p id="selOpp"></p>
    <div class="row"><button type="button" id="ready" class="primary big">준비 완료</button><button type="button" id="selLeave" class="big">나가기</button></div>
  </div>
</div>
<script src="assets/peerjs.min.js"></script>

const P_COL = ['#6fb3ff', '#ff7a6b'];

// ---------- sound: synthesized 8-bit effects (no audio files) ----------
// Sounds are chosen by watching what changed on screen, so an online guest (who only
// receives state) hears the same thing as the host.
const SFX = (() => {
  let ac = null, master = null, on = true;
  try { on = localStorage.getItem('cadet-fight-sound') !== 'off'; } catch (_) {}
  const unlock = () => {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = 0.32; master.connect(ac.destination); } catch (_) { return; } }
    if (ac.state === 'suspended') ac.resume().catch(() => {});
  };
  addEventListener('pointerdown', unlock, true); addEventListener('keydown', unlock, true);   // browsers need a gesture first
  function tone(type, f0, f1, dur, vol = 0.5, delay = 0, lp = 0) {
    const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);

  const { fw, bk } = dirs(f, i);

  if (i.sp) { const k = fw ? 'sp2' : 'sp1'; if (canUse(f, k)) return start(f, gunReady(f, k)); }
  if (!f.ground) {
    if ((i.hp || i.lp) && !f.airUsed) { f.airUsed = true; const k = i.hp ? 'jhp' : 'jlp'; f.airMove = f.c.moves[k]; return start(f, k); }

    return;

  if (i.hp) return start(f, gunReady(f, i.d ? 'chp' : 'hp'));
  if (i.lp) return start(f, i.d ? 'clp' : 'lp');

  if (tapB) { if (tick - f.tapB < 14) return dash(f, -1); f.tapB = tick; }

function dash(f, d) {

function start(f, k) {

  if (f.ground) f.vx = 0;

  if (mv.cd) f.cd = mv.cd;

function runMove(f, o) {

}

function fire(f, o, mv) {

      G.proj.push({ owner: f, tgt: o, x: o.x, y: -40, vx: 0, wait: p.warn, dir: f.face, p, w: 18, h: 30, life: 240, passed: true, done: false });

function counselor(owner, tgt, x, mode) {

function physics(f) {

function melee(f, o) {

function updateProj() {
  for (const p of G.proj) {

    p.x += p.vx; p.life--;
    const o = p.tgt;
    if (overlap({ x: p.x - p.w / 2, y: p.y - p.h / 2, w: p.w, h: p.h }, hurt(o))) {

function fallShell(p) {

  p.y += p.p.vy;
  if (p.y < GROUND - 10) return;
  p.done = true;
  const o = p.tgt, q = p.p;

}

function updateSum() {
  for (const s of G.sum) {
    s.t++;
    const o = s.tgt;
    if (s.st === 'run') {
      s.face = o.x >= s.x ? 1 : -1; s.x += s.face * 6.5;
      if (Math.abs(o.x - s.x) < 62 * K) { s.st = 'atk'; s.t = 0; }
      else if (s.t > 200) { s.st = 'leave'; s.t = 0; }
    } else if (s.st === 'drop') {

    } else if (s.st === 'atk') {

function roundOver() {
  if (G.phase !== 'fight') return;
  const [a, b] = G.p;
  const w = a.hp > b.hp ? 0 : b.hp > a.hp ? 1 : -1;
  if (w >= 0) G.p[w].wins++;
  Object.assign(G, { phase: 'end', pt: 0, winner: w, msg: (a.hp <= 0 || b.hp <= 0) ? 'K.O.' : 'TIME' });
}

function recordTrail(f) {

  const fast = Math.abs(f.vx) > 3.5 || (f.st === 'hitstun' && f.t < 10) ||
               (f.st === 'attack' && mv && f.t >= mv.su - 3 && f.t < mv.su + (mv.ac || 1) + 4) || (!f.ground && f.st !== 'ko');
  if (fast) { if (tick % 2 === 0) f.trail.push({ ...f, trail: null }); }

  for (const e of G.fx) e.t++;
  G.fx = G.fx.filter(e => e.t < e.life);
}

// ---------- drawing ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

}
function limb(sx, sy, hx, hy, color, width, bend = 8) {

}

function drawStage() {
  if (ready(bgImg)) { ctx.fillStyle = '#000'; ctx.fillRect(-20, -20, W + 40, H + 40); ctx.drawImage(bgImg, 0, 0, W, H); return; }
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
  sky.addColorStop(0, '#0b1426'); sky.addColorStop(1, '#22365c');
  ctx.fillStyle = sky; ctx.fillRect(-20, -20, W + 40, GROUND + 20);
  // academy skyline
  ctx.fillStyle = '#16233d';
  const blocks = [[-20, 330, 170], [140, 300, 120], [250, 345, 200], [440, 290, 90], [520, 320, 210], [720, 300, 140], [850, 335, 140]];
  for (const [x, y, w] of blocks) ctx.fillRect(x, y, w, GROUND - y);
  ctx.fillStyle = 'rgba(240,181,69,.35)';
  for (const [x, y, w] of blocks) for (let wx = x + 14; wx < x + w - 10; wx += 22) for (let wy = y + 16; wy < GROUND - 30; wy += 26) if ((wx * 7 + wy) % 5 < 2) ctx.fillRect(wx, wy, 6, 8);
  // flagpoles (no flags)
  ctx.fillStyle = '#2c3b5e'; ctx.fillRect(470, 230, 3, GROUND - 230); ctx.fillRect(492, 240, 3, GROUND - 240);
  // parade ground
  const fl = ctx.createLinearGradient(0, GROUND, 0, H);
  fl.addColorStop(0, '#2a3348'); fl.addColorStop(1, '#151b2a');
  ctx.fillStyle = fl; ctx.fillRect(-20, GROUND, W + 40, H - GROUND + 20);
  ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 1;
  for (let k = -10; k <= 10; k++) { ctx.beginPath(); ctx.moveTo(W / 2 + k * 60, GROUND); ctx.lineTo(W / 2 + k * 150, H + 20); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(240,181,69,.5)'; ctx.beginPath(); ctx.moveTo(-20, GROUND); ctx.lineTo(W + 20, GROUND); ctx.stroke();
}

function spritePose(s) {
  const mv = s.mv;
  if (s.st === 'ko') return sprite(s.key, 'ko') ? 'ko' : 'hit';
  if (s.st === 'hitstun') return 'hit';
  if (s.st === 'stun') return 'stun';
  if ((G.phase === 'end' || G.phase === 'match') && G.winner === s.i && s.ground) return 'win';
  if (s.st === 'blockstun' || s.guard) return s.crouch && s.ground ? 'cguard' : 'guard';
  if (s.st === 'attack' && mv) {
    if (mv.art) { if (sprite(s.key, mv.art)) return mv.art; return mv.low ? 'crouch' : mv.air ? 'jump' : 'light'; }
    if ((s.mk === 'lp' || s.mk === 'hp') && s.t < mv.su) return 'idle';
    return { lp: 'light', hp: 'heavy', sp1: 'sp1', sp2: 'sp2', su: sprite(s.key, 'super') ? 'super' : 'light' }[s.mk];

}
function drawSprite(s, o) {

  const m = SPRITE_META[s.key][pose];
  const img = o.ghost ? tinted(s.key, pose, o.ghost) : SPR[s.key].img[pose];
  if (!img || (!o.ghost && !ready(img))) return false;
  ctx.save();

  ctx.translate(s.x, s.y);
  if (!o.ghost) { const lift = Math.min(1, (GROUND - s.y) / 300); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0, GROUND - s.y, 40 * K * (1 - lift * 0.5), 8, 0, 0, Math.PI * 2); ctx.fill(); }
  ctx.scale(s.face * s.sx * K, s.sy * K);

  if (s.st === 'idle') ctx.scale(1, 1 + Math.sin(tick * 0.08) * 0.012);

  const bob = s.st === 'idle' ? Math.sin(tick * 0.08) * 1.5 : 0;

  const legC = col(c.trim), armC = col(c.body), skin = col(c.skin);

  }
  const d = me.tier === opp.tier ? (won ? 8 : -8) : me.tier > opp.tier ? (won ? 3 : -7) : (won ? 10 : -5);
  if (won) {

          fx: (s.fx || []).filter(e => e && typeof e === 'object').map(e => ({ ...e, text: e.text == null ? undefined : String(e.text) })) };
    for (const f of p) recordTrail(f);
  } catch (_) { /* malformed snapshot from the room: keep the last good frame */ }
}



function send(msg) {
  const c = NET.conn;
  if (!c || !c.open) return;
  try { c.send(msg); } catch (_) { /* channel closing */ }
}
const ranked = () => FB_ON && !!ACC.me && NET.role !== 'solo' && !!NET.oppAtStart && !!NET.oppAtStart.nick;
const myProfile = () => ACC.me ? { nick: ACC.me.nick, tier: ACC.me.tier, pts: ACC.me.pts, promo: ACC.me.promo, pw: ACC.me.pw, pl: ACC.me.pl } : { nick: '' };

// --- per frame ---
function netFrame() {
  restartBtn.hidden = true;
  if (NET.stage === 'fight' && G.phase === 'match' && !NET.done) matchOver();
  if (NET.nextSel && performance.now() > NET.nextSel) { NET.nextSel = 0; openSelect(); }
  if (!NET.conn || !NET.conn.open) return;
  if (NET.role === 'host') {
    if (G.phase !== 'fight') NET.gLast = NET.gin.c.slice();   // presses made outside the fight don't carry over
    if (NET.stage === 'fight' && tick % 2 === 0) send({ t: 's', q: ++NET.seq, s: snapshot() });
  } else if (NET.role === 'guest' && NET.stage === 'fight') {
    const h = heldLocal(), bits = (h.l ? 1 : 0) | (h.r ? 2 : 0) | (h.u ? 4 : 0) | (h.d ? 8 : 0);
    const inp = { h: bits, c: CK.map(k => CNT[k]) }, key = JSON.stringify(inp), now = performance.now();
    if (key !== NET.sentIn || now - NET.sentAt > 200) { NET.sentIn = key; NET.sentAt = now; send({ t: 'in', ...inp }); }
    pressed.clear();
  }
}

// match finished (both phones see it): rate it, then back to character select
async function matchOver() {
  NET.done = true;
  const mySide = NET.role === 'guest' ? 1 : 0, w = G.p.findIndex(f => f.wins >= 2);
  let line = w < 0 ? '무승부' : w === mySide ? '승리!' : '패배';
  if (w >= 0 && ranked()) {
    const before = ACC.me, after = rateMatch(before, NET.oppAtStart, w === mySide);
    try { await saveMe(after); line += ' · ' + changeText(before, after); updateMe(); }
    catch (e) { line += ' · ' + e.message; }
  }
  $('selResult').textContent = line;
  NET.nextSel = performance.now() + 3500;
}

// --- screens ---
function showLobby(msg) { closeSelect(); NET.stage = 'lobby'; lobbyEl.hidden = false; if (msg != null) lobbyMsg.textContent = msg; refreshBoard(); }
function hideLobby() { lobbyEl.hidden = true; cv.focus(); }
function setStatus(t) { statusEl.textContent = t; }
function updateMe() {
  const me = ACC.me;
  $('vLogin').hidden = !!me || !FB_ON; $('vMenu').hidden = !me && FB_ON; $('logoutRow').hidden = !me;
  if (me) { $('meNick').textContent = me.nick; $('meRank').textContent = rankText(me); }
  else if (!FB_ON) { $('meNick').textContent = '순위 서버 설정 전'; $('meRank').textContent = '온라인은 순위 없이 가능'; }
  const canNet = typeof window.Peer === 'function' && (!!me || !FB_ON);
  $('create').disabled = $('join').disabled = !canNet;
}
async function refreshBoard() {
  const body = $('boardBody');
  if (!FB_ON) { body.innerHTML = '<tr><td colspan="4">순위 서버가 아직 설정되지 않았어요.</td></tr>'; return; }
  try {
    const list = await leaderboard();
    body.textContent = '';
    if (!list.length) body.innerHTML = '<tr><td colspan="4">아직 아무도 없어요. 첫 번째가 되어보세요!</td></tr>';
    list.forEach((p, k) => {
      const tr = document.createElement('tr');
      if (ACC.me && p.nick === ACC.me.nick) tr.className = 'mine';
      for (const [t, c] of [[k + 1, ''], [p.nick, ''], [rankText(p), ''], [`${p.wins}승 ${p.losses}패`, 'r']]) {
        const td = document.createElement('td'); td.textContent = t; if (c) td.className = c; tr.append(td);
      }
      body.append(tr);
    });
  } catch (e) { body.innerHTML = ''; const tr = document.createElement('tr'), td = document.createElement('td'); td.colSpan = 4; td.textContent = e.message; tr.append(td); body.append(tr); }
}

// character select
const charsEl = $('chars');
for (const k of Object.keys(CHARS)) {
  const b = document.createElement('button');
  b.type = 'button'; b.dataset.c = k;
  const img = document.createElement('img'); img.src = `assets/${k}_idle.webp`; img.alt = '';
  const sp = document.createElement('span'); sp.textContent = CH[k].name;
  b.append(img, sp); charsEl.append(b);
  b.addEventListener('click', () => { if (SEL.me.ready) return; SEL.me.char = k; try { localStorage.setItem('cadet-fight-char', k); } catch (_) {} drawSelect(); sendPick(); });
}
function drawSelect() {
  for (const b of charsEl.children) { b.setAttribute('aria-pressed', String(b.dataset.c === SEL.me.char)); b.disabled = SEL.me.ready && b.dataset.c !== SEL.me.char; }
  $('ready').textContent = SEL.me.ready ? '준비 취소' : '준비 완료';
  let o;
  if (NET.role === 'solo') o = '상대: 허수아비 (' + CH[other(SEL.me.char)].name + ')';
  else if (!NET.opp) o = '상대를 기다리는 중…';
  else o = `상대: ${NET.opp.nick || '손님'}${NET.opp.nick && FB_ON ? ' · ' + rankText(NET.opp) : ''} — ${SEL.opp.ready ? CH[SEL.opp.char].name + ' 준비 완료' : '고르는 중…'}`;
  $('selOpp').textContent = o;
}
function openSelect() {
  NET.stage = 'select'; SEL.me.ready = false;
  lobbyEl.hidden = true; selEl.hidden = false; drawSelect(); sendPick();
}
function closeSelect() { selEl.hidden = true; }
function sendPick() { if (NET.role !== 'solo') send({ t: 'pick', char: SEL.me.char, ready: SEL.me.ready, prof: myProfile() }); }
$('ready').addEventListener('click', () => {
  SEL.me.ready = !SEL.me.ready; drawSelect(); sendPick();
  if (NET.role === 'solo' && SEL.me.ready) { PICK.p1 = SEL.me.char; PICK.p2 = other(SEL.me.char); startFight(); }
  else if (NET.role === 'host') maybeStart();
});
$('selLeave').addEventListener('click', () => { leaveRoom(); newMatch(); showLobby(''); setStatus('메뉴'); });
function maybeStart() {
  if (!(SEL.me.ready && SEL.opp.ready && NET.conn && NET.conn.open)) return;
  PICK.p1 = SEL.me.char; PICK.p2 = SEL.opp.char;
  send({ t: 'go', p1: PICK.p1, p2: PICK.p2 });
  startFight();
}
function startFight() {
  NET.oppAtStart = NET.opp ? { ...NET.opp } : null; NET.done = false; NET.nextSel = 0;
  SEL.me.ready = SEL.opp.ready = false;
  $('selResult').textContent = '';
  newMatch();   // guest too: clears the last match locally until the host's states arrive
  closeSelect(); hideLobby(); NET.stage = 'fight';
  setStatus(NET.role === 'solo' ? '혼자 연습' : `방 ${NET.code.toUpperCase()} · vs ${NET.opp && NET.opp.nick || '상대'}`);
}

// lobby buttons
$('menu').addEventListener('click', () => { leaveRoom(); newMatch(); showLobby(''); setStatus('메뉴'); });
$('solo').addEventListener('click', () => { leaveRoom(); NET.role = 'solo'; NET.opp = null; openSelect(); setStatus('혼자 연습'); });
async function doAuth(fn) {
  const nick = $('nick').value.trim(), pw = $('pw').value, bad = checkNick(nick, pw);
  if (bad) { lobbyMsg.textContent = bad; return; }
  $('login').disabled = $('signup').disabled = true; lobbyMsg.textContent = '확인 중…';
  try { await fn(nick, pw); $('pw').value = ''; lobbyMsg.textContent = ''; updateMe(); refreshBoard(); }
  catch (e) { lobbyMsg.textContent = e.message; }
  $('login').disabled = $('signup').disabled = false;
}
$('login').addEventListener('click', () => doAuth(logIn));
$('signup').addEventListener('click', () => doAuth(signUp));
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') doAuth(logIn); });
$('logout').addEventListener('click', () => { leaveRoom(); logOut(); updateMe(); refreshBoard(); lobbyMsg.textContent = '로그아웃했어요.'; });

function leaveRoom() {
  clearTimeout(NET.timer);
  if (NET.conn) { try { NET.conn.close(); } catch (_) {} }
  if (NET.peer) { try { NET.peer.destroy(); } catch (_) {} }
  Object.assign(NET, { role: 'solo', peer: null, conn: null, code: '', lastSnap: null, sentIn: '', seq: 0, lastSeq: -1, opp: null, nextSel: 0, done: true });
  closeSelect();
}

const ERR = {
  'peer-unavailable': '그 코드의 방이 없어요. 코드를 다시 확인하거나, 방장이 방을 다시 만들어주세요.',
  'network': '연결 서버에 닿지 못했어요. 인터넷 연결을 확인해주세요.',
  'server-error': '연결 서버가 응답하지 않아요. 잠시 후 다시 해주세요.',
  'socket-error': '연결 서버와 통신이 끊겼어요. 잠시 후 다시 해주세요.',
  'socket-closed': '연결 서버와 통신이 끊겼어요. 잠시 후 다시 해주세요.',
  'browser-incompatible': '이 브라우저는 온라인 대전을 지원하지 않아요. 크롬이나 사파리 최신 버전으로 열어주세요.',
  'webrtc': '휴대폰끼리 연결하지 못했어요. 한 명이 와이파이↔데이터를 바꿔서 다시 해보세요.'
};
const errText = e => ERR[e && e.type] || ('연결 오류 (' + (e && e.type || '알 수 없음') + ')');
const cleanProf = p => (p && typeof p === 'object') ? { nick: String(p.nick || '').slice(0, 10), tier: Math.max(0, Math.min(TOP, p.tier | 0)), pts: p.pts | 0, promo: !!p.promo, pw: p.pw | 0, pl: p.pl | 0 } : { nick: '' };

// host: open a peer named after the room code and wait for one guest
function createRoom(attempt = 0) {
  leaveRoom();
  const code = Array.from({ length: 4 }, () => 'abcdefghjkmnpqrstuvwxyz23456789'[Math.random() * 31 | 0]).join('');
  const peer = new Peer(ID_PREFIX + code);
  Object.assign(NET, { role: 'host', peer, code });
  lobbyMsg.textContent = '방을 여는 중…';
  peer.on('open', () => {
    lobbyMsg.innerHTML = '';
    lobbyMsg.append('방 코드 ', Object.assign(document.createElement('strong'), { textContent: code.toUpperCase() }), ' · 상대가 이 코드를 입력하면 캐릭터 선택으로 넘어가요');
    setStatus('방 ' + code.toUpperCase() + ' · 상대 기다리는 중');
  });
  peer.on('connection', conn => {
    if (NET.conn && NET.conn.open) {                                   // one guest only
      conn.on('open', () => { try { conn.send({ t: 'full' }); } catch (_) {} setTimeout(() => conn.close(), 300); });
      return;
    }
    NET.conn = conn;
    conn.on('data', onHostData);
    conn.on('close', () => {
      if (NET.conn !== conn) return;
      NET.conn = null; NET.opp = null; newMatch();
      showLobby('상대가 나갔어요. 같은 코드 ' + NET.code.toUpperCase() + '로 다시 들어올 수 있어요.');
      setStatus('방 ' + NET.code.toUpperCase() + ' · 상대 기다리는 중');
    });
  });
  peer.on('error', e => {
    if (e.type === 'unavailable-id' && attempt < 3) return createRoom(attempt + 1);   // code already taken: pick another
    if (NET.peer === peer) lobbyMsg.textContent = errText(e);
  });
}
function onHostData(m) {
  if (!m || typeof m !== 'object') return;
  NET.bytes += JSON.stringify(m).length;
  if (m.t === 'hello' && NET.conn) {
    NET.opp = cleanProf(m.prof);
    NET.gin = { h: 0, c: [0, 0, 0, 0, 0, 0] }; NET.gLast = [0, 0, 0, 0, 0, 0]; NET.ginInit = false;
    send({ t: 'hello', prof: myProfile() });
    newMatch(); openSelect();
    setStatus('방 ' + NET.code.toUpperCase() + ' · 캐릭터 선택');
  } else if (m.t === 'pick') {
    if (CHARS[m.char]) SEL.opp.char = m.char;
    SEL.opp.ready = !!m.ready && CHARS[m.char]; NET.opp = cleanProf(m.prof);
    if (NET.stage === 'select') { drawSelect(); maybeStart(); }
  } else if (m.t === 'in' && Array.isArray(m.c)) {
    const c = CK.map((_, k) => Math.max(0, Math.min(1e9, Number(m.c[k]) | 0)));
    if (!NET.ginInit) { NET.gLast = c.slice(); NET.ginInit = true; }   // first input from this guest: count presses from here
    NET.gin = { h: Number(m.h) & 15, c };
  }
}

// guest: open an anonymous peer, then dial the host's room code
function joinRoom() {
  const code = $('code').value.trim().toLowerCase();
  if (!/^[a-z0-9]{4}$/.test(code)) { lobbyMsg.textContent = '방 코드 4자리를 입력해주세요.'; return; }
  leaveRoom();
  const peer = new Peer();
  Object.assign(NET, { role: 'guest', peer, code });
  lobbyMsg.textContent = '연결 중…';
  setStatus('방 ' + code.toUpperCase() + ' · 연결 중');
  NET.timer = setTimeout(() => {
    if (NET.peer === peer && !(NET.conn && NET.conn.open)) { leaveRoom(); lobbyMsg.textContent = '15초 안에 연결되지 않았어요. ' + ERR.webrtc; setStatus('메뉴'); }
  }, 15000);
  peer.on('open', () => {
    const conn = peer.connect(ID_PREFIX + code, { reliable: false, serialization: 'json' });
    NET.conn = conn;
    conn.on('open', () => { clearTimeout(NET.timer); NET.sentIn = ''; send({ t: 'hello', prof: myProfile() }); lobbyMsg.textContent = '연결됐어요…'; });
    conn.on('data', m => {
      if (!m || typeof m !== 'object') return;
      NET.bytes += JSON.stringify(m).length;
      if (m.t === 'full') { leaveRoom(); showLobby('이미 두 명이 대전 중인 방이에요.'); setStatus('메뉴'); return; }
      if (m.t === 'hello') { NET.opp = cleanProf(m.prof); openSelect(); setStatus('방 ' + code.toUpperCase() + ' · 캐릭터 선택'); }
      else if (m.t === 'pick') { if (CHARS[m.char]) SEL.opp.char = m.char; SEL.opp.ready = !!m.ready; NET.opp = cleanProf(m.prof); if (NET.stage === 'select') drawSelect(); }
      else if (m.t === 'go' && CHARS[m.p1] && CHARS[m.p2]) { PICK.p1 = m.p1; PICK.p2 = m.p2; NET.lastSeq = -1; NET.lastSnap = null; startFight(); }
      else if (m.t === 's' && NET.stage === 'fight' && (m.q | 0) > NET.lastSeq) { NET.lastSeq = m.q | 0; applySnap(m.s); }
    });
    conn.on('close', () => { if (NET.conn === conn) { leaveRoom(); newMatch(); showLobby('방장과 연결이 끊겼어요.'); setStatus('메뉴'); } });
  });
  peer.on('error', e => { if (NET.peer === peer) { clearTimeout(NET.timer); leaveRoom(); lobbyMsg.textContent = errText(e); setStatus('메뉴'); } });
}
$('create').addEventListener('click', () => createRoom());
$('code').addEventListener('input', e => { e.target.value = e.target.value.replace(/[^a-z0-9]/gi, '').slice(0, 4); });
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(); });
$('join').addEventListener('click', joinRoom);
addEventListener('pagehide', leaveRoom);

// start: resume a saved login, show the menu
NET.done = true;
updateMe(); refreshBoard(); setStatus('메뉴');
if (typeof window.Peer !== 'function') lobbyMsg.textContent = '온라인 모듈을 불러오지 못했어요. 혼자 연습은 가능해요.';
if (FB_ON) resume().then(me => { if (me) { updateMe(); refreshBoard(); } });

// ---------- loop ----------
newMatch();
let last = performance.now(), acc = 0;
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  acc += dt * (opt.slow ? 0.25 : 1);
  while (acc >= 1 / 60) { if (NET.role !== 'guest') step(); tick++; acc -= 1 / 60; }
  netFrame();
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__game = { get G() { return G; }, step, opt, NET };
})();
</script>
</body>
</html>
